<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inferno — Horizonte 64 Software</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../../">
        <img src="TemplateData/isotipo.png" alt="" width="141" height="144">
        <span>HORIZONTE <b>64</b></span>
      </a>
      <nav><a href="../../#juegos">Juegos</a></nav>
    </header>

    <main class="stage">
      <div class="window">
        <div class="window-bar">
          <span>INFERNO.EXE</span>
          <span class="window-buttons">
            <button id="fullscreen" type="button" title="Pantalla completa" disabled>⛶</button>
          </span>
        </div>

        <div class="screen">
          <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>

          <!-- Pantalla de inicio: el juego se descarga recién al pulsar JUGAR
               (y ese clic permite que el navegador reproduzca sonido) -->
          <div id="start" class="overlay">
            <img class="cover" src="TemplateData/cover.webp" alt="">
            <img class="logo" src="TemplateData/logo.webp" alt="Inferno">
            <button id="play" class="btn" type="button">Jugar <span aria-hidden="true">&gt;</span></button>
            <p id="mobile-note" class="note" hidden>Este juego necesita teclado o gamepad.</p>
          </div>

          <div id="loading" class="overlay" hidden>
            <p>Cargando</p>
            <div class="bar"><div id="bar-fill"></div></div>
            <p id="percent">0%</p>
          </div>

          <div id="error" class="overlay" hidden>
            <p>No se pudo cargar el juego.</p>
            <p id="error-text" class="note"></p>
          </div>
        </div>
      </div>

      <dl class="controls">
        <div><dt>C</dt><dd>Moneda</dd></div>
        <div><dt>Espacio</dt><dd>Start / disparar</dd></div>
        <div><dt>Flechas / WASD</dt><dd>Mover</dd></div>
      </dl>
    </main>

    <script>
      var canvas = document.getElementById("unity-canvas");
      var startEl = document.getElementById("start");
      var loadingEl = document.getElementById("loading");
      var fullscreenBtn = document.getElementById("fullscreen");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.getElementById("mobile-note").hidden = false;
      }

      function startGame() {
        startEl.hidden = true;
        loadingEl.hidden = false;

        var script = document.createElement("script");
        script.src = "Build/inferno.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, {
            arguments: [],
            dataUrl: "Build/inferno.data.unityweb",
            frameworkUrl: "Build/inferno.framework.js.unityweb",
            codeUrl: "Build/inferno.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Horizonte 64 Software",
            productName: "Inferno",
            productVersion: "1.0",
          }, function (progress) {
            var pct = Math.round(progress * 100);
            document.getElementById("bar-fill").style.width = pct + "%";
            document.getElementById("percent").textContent = pct + "%";
          }).then(function (unityInstance) {
            loadingEl.hidden = true;
            canvas.focus();
            fullscreenBtn.disabled = false;
            fullscreenBtn.onclick = function () { unityInstance.SetFullscreen(1); };
          }).catch(function (message) {
            loadingEl.hidden = true;
            document.getElementById("error").hidden = false;
            document.getElementById("error-text").textContent = message;
          });
        };
        document.body.appendChild(script);
      }

      document.getElementById("play").addEventListener("click", startGame);
      // Al hacer clic en el juego, recupera el foco del teclado
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
